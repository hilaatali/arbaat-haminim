<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מודעת פרסום - ארבעת המינים למהדרין</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { font-family: 'Rubik', sans-serif; }
  </style>
</head>
<body class="bg-stone-900 min-h-screen flex flex-col items-center justify-center p-4 py-8">

  <!-- כפתור הורדה כתמונה -->
  <div class="mb-5">
    <button onclick="downloadPoster()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-6 rounded-2xl shadow-xl transition flex items-center gap-2 text-sm md:text-base">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
      <span>הורדת המודעה כתמונה (PNG) לשיתוף</span>
    </button>
  </div>

  <!-- כרזת הפרסומת (מיועדת לשמירה) -->
  <div id="posterCard" class="w-full max-w-[480px] bg-gradient-to-b from-[#12281c] via-[#1a3827] to-[#0f2117] text-white rounded-[36px] p-7 shadow-2xl border-2 border-amber-400/40 relative overflow-hidden">
    
    <!-- עיטורי רקע מוזהבים -->
    <div class="absolute -top-16 -right-16 w-44 h-44 bg-amber-400/10 rounded-full blur-2xl"></div>
    <div class="absolute -bottom-16 -left-16 w-44 h-44 bg-emerald-400/10 rounded-full blur-2xl"></div>

    <!-- כותרת ראשית עליונה -->
    <div class="text-center relative z-10 space-y-2">
      <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-amber-400/15 text-amber-300 text-[11px] font-bold border border-amber-400/30">
        <span>✨</span> חג הסוכות • מהדרין מן המהדרין
      </div>
      
      <h1 class="text-3xl font-black text-white tracking-tight drop-shadow-md">
        מכירת ארבעת המינים למהדרין
      </h1>
      <p class="text-emerald-200 text-xs font-medium">
        מבחר סטים מבוקרים, נקיים ומהודרים כהלכתם
      </p>
    </div>

    <!-- תמונת ארבעת המינים המרכזית -->
    <div class="my-5 relative z-10 flex justify-center">
      <div class="w-36 h-44 bg-white/10 backdrop-blur-md rounded-3xl p-3 border border-amber-300/30 shadow-inner flex items-center justify-center">
        <svg viewBox="0 0 160 220" class="w-full h-full drop-shadow-lg">
          <!-- לולב -->
          <line x1="80" y1="210" x2="80" y2="8" stroke="#256e29" stroke-width="7" stroke-linecap="round"/>
          <line x1="79" y1="8" x2="79" y2="210" stroke="#184e1b" stroke-width="2"/>

          <!-- ערבות -->
          <path d="M72 195 Q52 130 45 40" stroke="#8d5b4c" stroke-width="2.5" fill="none"/>
          <path d="M45 40 C35 55 35 75 48 90" fill="#7cb342"/>
          <path d="M49 85 C30 100 28 125 55 135" fill="#8bc34a"/>
          <path d="M56 130 C32 145 35 168 62 172" fill="#7cb342"/>

          <path d="M76 195 Q60 110 58 15" stroke="#795548" stroke-width="2" fill="none"/>
          <path d="M58 15 C50 30 52 48 62 60" fill="#8bc34a"/>
          <path d="M62 60 C48 78 50 102 66 112" fill="#7cb342"/>

          <!-- הדסים משולשים -->
          <line x1="108" y1="195" x2="115" y2="45" stroke="#4e342e" stroke-width="2.5"/>
          <g fill="#1b5e20">
            <path d="M115 45 C111 40 107 43 111 50 Z"/>
            <path d="M115 45 C119 40 123 43 119 50 Z"/>
            <path d="M114 62 C108 57 104 61 109 69 Z"/>
            <path d="M114 62 C120 57 124 61 119 69 Z"/>
            <path d="M113 80 C106 74 102 79 107 88 Z"/>
            <path d="M113 80 C120 74 124 79 119 88 Z"/>
            <path d="M111 100 C103 93 99 99 105 109 Z"/>
            <path d="M111 100 C119 93 123 99 117 109 Z"/>
          </g>

          <!-- אתרוג -->
          <path d="M80 118 C83 126 90 138 98 152 C108 168 106 190 92 201 C78 212 58 208 51 192 C45 178 48 160 58 145 C67 131 77 125 80 118 Z" 
                fill="#ffd600" stroke="#e6b800" stroke-width="1.8"/>
          <path d="M53 186 C49 174 51 159 60 147 C67 136 75 127 79 120" stroke="#fff9c4" stroke-width="2.5" fill="none"/>
          <circle cx="80" cy="116" r="2.8" fill="#4e342e"/>
          <line x1="80" y1="116" x2="80" y2="110" stroke="#3e2723" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- פירוט מחירון הסטים -->
    <div class="space-y-2.5 relative z-10 mb-4">
      <div class="flex items-center justify-between p-2.5 rounded-2xl bg-white/10 border border-white/10">
        <div class="flex items-center gap-2">
          <span class="text-base">🍋</span>
          <span class="font-bold text-sm">סט כשר בסיסי</span>
        </div>
        <span class="font-black text-amber-300 text-base">₪85</span>
      </div>

      <div class="flex items-center justify-between p-2.5 rounded-2xl bg-emerald-800/40 border border-emerald-400/40 shadow-xs">
        <div class="flex items-center gap-2">
          <span class="text-base">🌟</span>
          <div>
            <span class="font-extrabold text-sm text-white">סט מהודר</span>
            <span class="text-[10px] text-amber-300 block font-normal">הכי מבוקש</span>
          </div>
        </div>
        <span class="font-black text-amber-300 text-lg">₪160</span>
      </div>

      <div class="flex items-center justify-between p-2.5 rounded-2xl bg-white/10 border border-white/10">
        <div class="flex items-center gap-2">
          <span class="text-base">👑</span>
          <span class="font-bold text-sm">סט פרימיום - מהודר מן המהודר</span>
        </div>
        <span class="font-black text-amber-300 text-base">₪270</span>
      </div>
    </div>

    <!-- מאפיינים ונוחות -->
    <div class="grid grid-cols-3 gap-2 text-center text-[11px] text-emerald-100 relative z-10 mb-5 border-t border-b border-white/10 py-2.5">
      <div>🚚 משלוח עד הבית</div>
      <div>📱 תשלום ב-Bit</div>
      <div>🏦 העברה בנקאית</div>
    </div>

    <!-- יצירת קשר והזמנות -->
    <div class="text-center relative z-10 space-y-1 bg-amber-400/10 p-3 rounded-2xl border border-amber-400/30">
      <span class="text-xs text-amber-200 block font-bold">להזמנות ישירות בוואטסאפ:</span>
      <div class="text-2xl font-black text-white font-mono tracking-wider">053-9621454</div>
      <span class="text-[11px] text-emerald-200 block">או דרך האתר המקוון</span>
    </div>

  </div>

  <script>
    function downloadPoster() {
      const poster = document.getElementById('posterCard');
      html2canvas(poster, { scale: 3 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'arbaat-haminim-poster.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
